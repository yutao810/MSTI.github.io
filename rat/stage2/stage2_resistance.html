<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阶段二：牵制位 · 意识操作划分</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div class="max-w-xl mx-auto bg-white rounded-xl p-6 shadow">
  <h1 class="text-2xl font-bold text-center mb-1">鼠问卷 · 阶段二</h1>
  <p class="text-gray-500 text-center mb-6">牵制位 · 意识操作划分</p>

  <div class="text-right text-sm text-gray-500 mb-4">
    阶段一得分：<span id="s1"></span> 分｜当前进度：<span id="progress">第 1 题 / 共6题</span>
  </div>

  <!-- 题目区域 -->
  <div id="question" class="space-y-6">
    <p class="text-lg font-semibold" id="q-text">题目文本</p>
    <div class="text-sm text-gray-500 text-center mb-1" id="labels">
      <span id="left-label">左侧</span> ｜ <span id="mid-label">中间</span> ｜ <span id="right-label">右侧</span>
    </div>
    <div class="flex gap-2 score-group">
      <button class="flex-1 border rounded py-3" onclick="pick(1)">1</button>
      <button class="flex-1 border rounded py-3" onclick="pick(2)">2</button>
      <button class="flex-1 border rounded py-3" onclick="pick(3)">3</button>
      <button class="flex-1 border rounded py-3" onclick="pick(4)">4</button>
      <button class="flex-1 border rounded py-3" onclick="pick(5)">5</button>
    </div>
  </div>

  <!-- 按钮组 -->
  <div class="mt-8 flex justify-between">
    <button id="back" class="px-4 py-2 border rounded disabled:opacity-40">← 返回上一题</button>
    <button id="submit" class="px-6 py-2 bg-green-600 text-white rounded hidden">提交确认</button>
  </div>
</div>

<script>
  const questions = [
    {
      text: "在牵制过程中，我更喜欢用操作上的优势让猫被迫应对我，而不是依靠站位和时机慢慢消耗它的耐心。",
      leftLabel: "完全不符合",
      midLabel: "",
      rightLabel: "完全符合",
      reverse: false
    },
    {
      text: "我觉得牵制位的核心价值在于把猫拖住、打乱它的节奏，只要时机选得对、站位站得好，用简单稳定不依赖复杂连招的手段也能让猫寸步难行。",
      leftLabel: "完全不符合",
      midLabel: "",
      rightLabel: "完全符合",
      reverse: true
    },
    {
      text: "我在牵制时最享受的，是那种通过精准操作把猫玩弄于股掌之间的感觉——比如利用位移躲掉它的攻击后立刻反手控住它，操作越秀越有成就感。",
      leftLabel: "完全不符合",
      midLabel: "",
      rightLabel: "完全符合",
      reverse: false
    },
    {
      text: "在牵制时，我更依赖小地图信息、队友的报点和猫的技能CD判断来做决策，专注于分析战局，作出决策。",
      leftLabel: "完全不符合",
      midLabel: "",
      rightLabel: "完全符合",
      reverse: true
    },
    {
      text: "我认为自己在牵制位上最大的优势不是能在操作上压制猫，而是能在猫最不想让我出现的时候出现，反复打乱它的计划。",
      leftLabel: "完全不符合",
      midLabel: "",
      rightLabel: "完全符合",
      reverse: true
    },
    {
      text: "我更享受用脑子让猫无可奈何的牵制方式，用站位、时机和预判反复打断猫的意图，而不是用操作爆发直接与之硬碰硬。",
      leftLabel: "完全不符合",
      midLabel: "",
      rightLabel: "完全符合",
      reverse: true
    }
  ];

  const total = 6;
  let current = 1;
  let score = [0,0,0,0,0,0,0];
  let selected = null;

  const urlParams = new URLSearchParams(location.search);
  const stage1Total = urlParams.get('stage1') || 0;
  document.getElementById('s1').innerText = stage1Total;

  const progress = document.getElementById("progress");
  const qText = document.getElementById("q-text");
  const leftLabel = document.getElementById("left-label");
  const midLabel = document.getElementById("mid-label");
  const rightLabel = document.getElementById("right-label");
  const btns = document.querySelectorAll(".score-group button");
  const back = document.getElementById("back");
  const submit = document.getElementById("submit");

  update();

  function pick(val) {
    selected = val;
    const q = questions[current - 1];
    score[current] = q.reverse ? 6 - val : val;

    btns.forEach((b,i) => {
      b.classList.toggle("bg-blue-500", i+1 === val);
      b.classList.toggle("text-white", i+1 === val);
    });

    setTimeout(() => {
      if (current < total) {
        next();
      } else {
        submit.classList.remove("hidden");
      }
    }, 200);
  }

  function next() {
    if (!selected) return;
    current++;
    selected = null;
    update();
  }

  back.onclick = () => {
    if (current <= 1) return;
    current--;
    selected = score[current] ? (questions[current - 1].reverse ? 6 - score[current] : score[current]) : null;
    update();
  };

  submit.onclick = () => {
    const sum = score.slice(1,7).reduce((a,b)=>a+b, 0);

    if (sum < 13) {
      location.href = `../stage3/ed6.html?stage1=${stage1Total}&stage2=${sum}`;
    } else if (sum <= 17) {
      location.href = `../stage3/ed7.html?stage1=${stage1Total}&stage2=${sum}`;
    } else {
      location.href = `../stage3/ed8.html?stage1=${stage1Total}&stage2=${sum}`;
    }
  };

  function update() {
    const q = questions[current - 1];
    qText.textContent = q.text;
    leftLabel.textContent = q.leftLabel;
    midLabel.textContent = q.midLabel;
    rightLabel.textContent = q.rightLabel;
    progress.textContent = `第 ${current} 题 / 共${total}题`;
    back.disabled = current <= 1;
    submit.classList.add("hidden");
    btns.forEach(b => b.classList.remove("bg-blue-500","text-white"));

    if (selected) {
      btns[selected-1].classList.add("bg-blue-500","text-white");
      if (current == total) submit.classList.remove("hidden");
    }
  }
</script>
</body>
</html>
