<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终角色确认</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #f3f4f6;
    min-height: 100vh;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    max-width: 28rem;
    width: 100%;
    background-color: white;
    border-radius: 1rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    color: #1f2937;
    margin-bottom: 1.5rem;
  }
  .question { margin-bottom: 1rem; }
  .question-title {
    font-size: 1.125rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 1rem;
    color: #374151;
  }
  .option {
    display: block;
    width: 100%;
    padding: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;
    background: white;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }
  .option:hover {
    background-color: #eff6ff;
    border-color: #bfdbfe;
  }
  .hidden { display: none; }
  .animate-fade {
    animation: fade 0.5s ease forwards;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container animate-fade">
  <h1>🐭 最终角色确认</h1>

  <div id="q1" class="question">
    <p class="question-title">你在选择奶酪位时会倾向选择以下哪种？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=梦游杰瑞'">选项1：能抓住奶酪窗口期迅速推入奶酪的角色</button>
    <button class="option" onclick="choose1(2)">选项2：能与猫博弈，自身灵活的角色</button>
  </div>

  <div id="q2" class="question hidden">
    <p class="question-title">你更喜欢哪种博弈流派？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=泰菲'">选项1：顶着猫的压力如同磐石一般安然不动的硬进流</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=罗宾汉杰瑞'">选项2：身轻如燕，瞬时间就能无影无踪的自卫流</button>
  </div>
</div>

<script>
  function choose1(num) {
    if (num === 2) {
      location.href = '../stage4/index.html?role=恶魔泰菲';
    } else {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q2").classList.remove("hidden");
    }
  }
</script>

</body>
</html>
