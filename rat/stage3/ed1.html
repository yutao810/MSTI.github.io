<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终角色确认</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

<div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 animate-fade">
  <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">🐭 最终角色确认</h1>

  <!-- 第一题 -->
  <div id="q1" class="space-y-4">
    <p class="text-lg font-semibold text-center">你玩游戏更偏向？</p>
    <button onclick="choose1(1)" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项1：稳救
    </button>
    <button onclick="choose1(2)" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项2：偏辅助
    </button>
  </div>

  <!-- 第二题（默认隐藏）- 稳救分支 -->
  <div id="q2" class="space-y-4 hidden">
    <p class="text-lg font-semibold text-center">你更看重什么？</p>
    <button onclick="goResult('尼宝')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项1：有牵制/上限高
    </button>
    <button onclick="goResult('剑客泰菲')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项2：有输出/下限高
    </button>
  </div>
</div>

<script>
  function choose1(num) {
    if (num === 2) {
      // 偏辅助 → 随机国王杰瑞或大表哥
      const choice = Math.random() < 0.5 ? '国王杰瑞' : '大表哥';
      location.href = `../../../result.html?role=${choice}`;
    } else {
      // 稳救 → 显示第二题
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q2").classList.remove("hidden");
    }
  }

  function goResult(role) {
    location.href = `../../../result.html?role=${role}`;
  }
</script>

<style>
  .animate-fade {
    animation: fade 0.5s ease forwards;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</body>
</html>
