<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终角色确认</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #f3f4f6;
    min-height: 100vh;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    max-width: 28rem;
    width: 100%;
    background-color: white;
    border-radius: 1rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    color: #1f2937;
    margin-bottom: 1.5rem;
  }
  .question { margin-bottom: 1rem; }
  .question-title {
    font-size: 1.125rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 1rem;
    color: #374151;
  }
  .option {
    display: block;
    width: 100%;
    padding: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;
    background: white;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }
  .option:hover {
    background-color: #eff6ff;
    border-color: #bfdbfe;
  }
  .hidden { display: none; }
  .animate-fade {
    animation: fade 0.5s ease forwards;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container animate-fade">
  <h1>🐭 最终角色确认</h1>

  <div id="q1" class="question">
    <p class="question-title">你更喜欢哪种游戏风格？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=天使泰菲'">选项1：能主动保护队友的角色</button>
    <button class="option" onclick="choose1(2)">选项2：更看重个人发挥的角色</button>
  </div>

  <div id="q2" class="question hidden">
    <p class="question-title">你个人的游戏理解水平在哪个范围内？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=罗宾汉泰菲'">选项1：有一些水平，但是肯定比不过大佬们</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=表演者杰瑞'">选项2：我是萌新/手残玩家/不喜欢操作型角色</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=莱恩'">选项3：我喜欢追求角色的上限，积极探索各类打法，对游戏有自己的一套理解</button>
  </div>
</div>

<script>
  function choose1(num) {
    if (num === 2) {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q2").classList.remove("hidden");
    }
  }
</script>

</body>
</html>
