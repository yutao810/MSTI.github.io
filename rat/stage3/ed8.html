<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终角色确认</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #f3f4f6;
    min-height: 100vh;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    max-width: 28rem;
    width: 100%;
    background-color: white;
    border-radius: 1rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    color: #1f2937;
    margin-bottom: 1.5rem;
  }
  .question { margin-bottom: 1rem; }
  .question-title {
    font-size: 1.125rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 1rem;
    color: #374151;
  }
  .option {
    display: block;
    width: 100%;
    padding: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;
    background: white;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }
  .option:hover {
    background-color: #eff6ff;
    border-color: #bfdbfe;
  }
  .hidden { display: none; }
  .animate-fade {
    animation: fade 0.5s ease forwards;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container animate-fade">
  <h1>🐭 最终角色确认</h1>

  <div id="q1" class="question">
    <p class="question-title">你更喜欢哪种角色？</p>
    <button class="option" onclick="choose1(1)">选项1：能控制猫方的角色</button>
    <button class="option" onclick="choose1(2)">选项2：能直接了当的打出伤害的角色</button>
  </div>

  <div id="q2" class="question hidden">
    <p class="question-title">你更喜欢哪种控制方式？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=拿坡里鼠'">选项1：单次稳定的控制</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=蒙金奇'">选项2：窗口期短时释放数次控制</button>
  </div>

  <div id="q3" class="question hidden">
    <p class="question-title">你更喜欢哪种输出方式？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=剑客杰瑞'">选项1：近身搏杀，刀尖舔血</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=朵朵'">选项2：中程输出，蓄力核爆</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=朝圣者泰菲'">选项3：远程暗杀，千里斩首</button>
  </div>
</div>

<script>
  function choose1(num) {
    if (num === 1) {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q2").classList.remove("hidden");
    } else {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q3").classList.remove("hidden");
    }
  }
</script>

</body>
</html>
