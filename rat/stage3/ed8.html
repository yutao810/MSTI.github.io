<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终角色确认</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

<div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 animate-fade">
  <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">🐭 最终角色确认</h1>

  <!-- 第一题 -->
  <div id="q1" class="space-y-4">
    <p class="text-lg font-semibold text-center">你更喜欢哪种战斗风格？</p>
    <button onclick="choose1(1)" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项1：控制
    </button>
    <button onclick="choose1(2)" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项2：直伤
    </button>
  </div>

  <!-- 第二题（默认隐藏）- 控制分支 -->
  <div id="q2" class="space-y-4 hidden">
    <p class="text-lg font-semibold text-center">你更喜欢哪种控制方式？</p>
    <button onclick="goResult('拿坡里鼠')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项1：单次控制
    </button>
    <button onclick="goResult('蒙金奇')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项2：持续输出
    </button>
  </div>

  <!-- 第三题（默认隐藏）- 直伤分支 -->
  <div id="q3" class="space-y-4 hidden">
    <p class="text-lg font-semibold text-center">你更喜欢哪种输出方式？</p>
    <button onclick="goResult('剑客杰瑞')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项1：近身
    </button>
    <button onclick="goResult('朵朵')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项2：中程
    </button>
    <button onclick="goResult('朝圣者泰菲')" class="w-full p-4 border border-gray-200 rounded-xl hover:bg-blue-50 transition text-left">
      选项3：暗杀
    </button>
  </div>
</div>

<script>
  function choose1(num) {
    if (num === 1) {
      // 控制 → 显示第二题
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q2").classList.remove("hidden");
    } else {
      // 直伤 → 显示第三题
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q3").classList.remove("hidden");
    }
  }

  function goResult(role) {
    location.href = `../../../result.html?role=${role}`;
  }
</script>

<style>
  .animate-fade {
    animation: fade 0.5s ease forwards;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</body>
</html>
