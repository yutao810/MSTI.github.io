<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终角色确认</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #f3f4f6;
    min-height: 100vh;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    max-width: 28rem;
    width: 100%;
    background-color: white;
    border-radius: 1rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    color: #1f2937;
    margin-bottom: 1.5rem;
  }
  .question { margin-bottom: 1rem; }
  .question-title {
    font-size: 1.125rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 1rem;
    color: #374151;
  }
  .option {
    display: block;
    width: 100%;
    padding: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.75rem;
    background: white;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }
  .option:hover {
    background-color: #eff6ff;
    border-color: #bfdbfe;
  }
  .hidden { display: none; }
  .animate-fade {
    animation: fade 0.5s ease forwards;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container animate-fade">
  <h1>🐭 最终角色确认</h1>

  <div id="q1" class="question">
    <p class="question-title">你认为作为辅助位玩家，更重要的是？</p>
    <button class="option" onclick="choose1(1)">选项1：意识</button>
    <button class="option" onclick="choose1(2)">选项2：操作</button>
    <button class="option" onclick="choose1(3)">选项3：意识和操作缺一不可</button>
  </div>

  <div id="q2" class="question hidden">
    <p class="question-title">你更喜欢？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=天使杰瑞'">选项1：站在大局角度看整场对局，将关键技能合理使用</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=恶魔杰瑞'">选项2：站在猫方角度看对局，利用技能提取布局，为队友创造时间</button>
  </div>

  <div id="q3" class="question hidden">
    <p class="question-title">你更喜欢哪种角色？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=玛丽'">选项1：有团队辅助能力，且技能依赖队友的角色</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=音乐家杰瑞'">选项2：合作收益高，但是必要时也可单走的角色</button>
  </div>

  <div id="q4" class="question hidden">
    <p class="question-title">如果让你来辅助队友，你会选择？</p>
    <button class="option" onclick="location.href='../stage4/index.html?role=雪梨'">选项1：利用角色技能组追上限，只要自己不批准队友就不会死</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=米雪儿'">选项2：提供有限的辅助能力和有限的帮助，尊重他人命运</button>
    <button class="option" onclick="location.href='../stage4/index.html?role=仙女鼠'">选项3：将筹码押在自己身上</button>
  </div>
</div>

<script>
  function choose1(num) {
    if (num === 1) {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q2").classList.remove("hidden");
    } else if (num === 2) {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q3").classList.remove("hidden");
    } else {
      document.getElementById("q1").classList.add("hidden");
      document.getElementById("q4").classList.remove("hidden");
    }
  }
</script>

</body>
</html>
