<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阶段二：功能位 · 风格划分</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div class="max-w-xl mx-auto bg-white rounded-xl p-6 shadow">
  <h1 class="text-2xl font-bold text-center mb-1">鼠问卷 · 阶段三</h1>
  <p class="text-gray-500 text-center mb-6">功能位 · 风格划分</p>

  <div class="text-right text-sm text-gray-500 mb-4">
    阶段一：<span id="s1"></span> 分｜阶段二：<span id="s2"></span> 分｜进度：<span id="progress">第 1 题 / 共5题</span>
  </div>

  <!-- 题目区域 -->
  <div id="question" class="space-y-6">
    <p class="text-lg font-semibold" id="q-text">题目文本</p>
    <div class="text-sm text-gray-500 text-center mb-1" id="labels">
      <span id="left-label">左侧</span> ｜ <span id="mid-label">中间</span> ｜ <span id="right-label">右侧</span>
    </div>
    <div class="flex gap-2 score-group">
      <button class="flex-1 border rounded py-3" onclick="pick(1)">1</button>
      <button class="flex-1 border rounded py-3" onclick="pick(2)">2</button>
      <button class="flex-1 border rounded py-3" onclick="pick(3)">3</button>
      <button class="flex-1 border rounded py-3" onclick="pick(4)">4</button>
      <button class="flex-1 border rounded py-3" onclick="pick(5)">5</button>
    </div>
  </div>

  <!-- 按钮组 -->
  <div class="mt-8 flex justify-between">
    <button id="back" class="px-4 py-2 border rounded disabled:opacity-40">← 返回上一题</button>
    <button id="submit" class="px-6 py-2 bg-green-600 text-white rounded hidden">提交确认</button>
  </div>
</div>

<script>
  const questions = [
    {
      text: "在一场对局中，我更享受根据局势在骚扰和支援之间自如切换的感觉，而不是只专注于其中一种。",
      leftLabel: "更喜欢牵制",
      midLabel: "确实喜欢",
      rightLabel: "更喜欢辅助",
      reverse: false
    },
    {
      text: "看到队友被追击时，我的第一反应是去给猫制造麻烦让它追不下去，而非给队友加增益帮其逃跑。",
      leftLabel: "完全不符合",
      midLabel: "看情况选",
      rightLabel: "完全符合",
      reverse: true
    },
    {
      text: "对我来说，干扰和辅助并不是对立的，我更愿意练就两者兼备的能力，让团队怎么缺都能顶上",
      leftLabel: "更喜欢干扰",
      midLabel: "完全符合",
      rightLabel: "更喜欢辅助",
      reverse: false
    },
    {
      text: "我认为最理想的功能位玩法不是纯粹牵制或纯粹辅助，而是根据局势随时调整自己的角色定位。",
      leftLabel: "牵制好玩",
      midLabel: "天啊这简直就是我",
      rightLabel: "辅助好玩",
      reverse: false
    },
    {
      text: "我选择功能位相关角色时，更容易被硬控、位移和输出类技能吸引，而非治疗、增益类技能。",
      leftLabel: "完全符合",
      midLabel: "我会看情况选",
      rightLabel: "完全不符合",
      reverse: false
    }
  ];

  const total = 5;
  let current = 1;
  let score = [0,0,0,0,0,0];
  let selected = null;

  const urlParams = new URLSearchParams(location.search);
  const stage1 = urlParams.get('stage1') || 0;
  const stage2 = urlParams.get('stage2') || 0;

  document.getElementById('s1').innerText = stage1;
  document.getElementById('s2').innerText = stage2;

  const progress = document.getElementById("progress");
  const qText = document.getElementById("q-text");
  const leftLabel = document.getElementById("left-label");
  const midLabel = document.getElementById("mid-label");
  const rightLabel = document.getElementById("right-label");
  const btns = document.querySelectorAll(".score-group button");
  const back = document.getElementById("back");
  const submit = document.getElementById("submit");

  update();

  function pick(val) {
    selected = val;
    const q = questions[current - 1];
    score[current] = q.reverse ? 6 - val : val;

    btns.forEach((b,i) => {
      b.classList.toggle("bg-blue-500", i+1 === val);
      b.classList.toggle("text-white", i+1 === val);
    });

    setTimeout(() => {
      if (current < total) {
        next();
      } else {
        submit.classList.remove("hidden");
      }
    }, 200);
  }

  function next() {
    if (!selected) return;
    current++;
    selected = null;
    update();
  }

  back.onclick = () => {
    if (current <= 1) return;
    current--;
    selected = score[current] ? (questions[current - 1].reverse ? 6 - score[current] : score[current]) : null;
    update();
  };

  submit.onclick = () => {
    const sum = score.slice(1,6).reduce((a,b)=>a+b, 0);

    if (sum < 13) {
      location.href = `../stage2/stage2_resistance.html?stage1=${stage1}&stage2=${sum}`;
    } else if (sum <= 17) {
      location.href = `../stage3/ed9.html?stage1=${stage1}&stage2=${sum}`;
    } else {
      location.href = `../stage3/ed10.html?stage1=${stage1}&stage2=${sum}`;
    }
  };

  function update() {
    const q = questions[current - 1];
    qText.textContent = q.text;
    leftLabel.textContent = q.leftLabel;
    midLabel.textContent = q.midLabel;
    rightLabel.textContent = q.rightLabel;
    progress.textContent = `第 ${current} 题 / 共${total}题`;
    back.disabled = current <= 1;
    submit.classList.add("hidden");
    btns.forEach(b => b.classList.remove("bg-blue-500","text-white"));

    if (selected) {
      btns[selected-1].classList.add("bg-blue-500","text-white");
      if (current == total) submit.classList.remove("hidden");
    }
  }
</script>
</body>
</html>
